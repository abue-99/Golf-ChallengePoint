name: Epic 1 - Dashboard Redesign Validation

on:
  pull_request:
    branches:
      - main
      - develop

    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-validation:
    name: Dashboard Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Web App
        run: pnpm turbo lint --filter=web

      - name: Type Check Web App
        run: pnpm turbo typecheck --filter=web

      - name: Build Web App
        run: pnpm turbo build --filter=web

      - name: Verify Dashboard Routes
        run: |
          echo "Checking dashboard related routes..."

          test -d apps/web || exit 1

          if [ ! -d "apps/web" ]; then
            echo "apps/web not found"
            exit 1
          fi

          echo "Dashboard structure found"

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-logs
          path: |
            .turbo
