name: Epic 6 - Dashboard Action Hub Validation

on:
  pull_request:
    branches:
      - main
      - develop

    paths:
      - "apps/web/app/(app)/dashboard/**"
      - "apps/web/app/api/dashboard/**"
      - "apps/web/components/PlayerActionDashboard.tsx"
      - "apps/web/components/CoachActionDashboard.tsx"
      - "apps/web/components/HeaderAndSidebarLayout.tsx"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  architecture-guard:
    name: Architecture Protection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Existing Models Remain
        run: |
          grep -q "model User" packages/db/prisma/schema.prisma
          grep -q "model PlayerDevelopmentPlan" packages/db/prisma/schema.prisma
          grep -q "model TrainingBlock" packages/db/prisma/schema.prisma
          grep -q "model LessonAssignment" packages/db/prisma/schema.prisma

      - name: Verify PlayerActionDashboard exists
        run: |
          test -f apps/web/components/PlayerActionDashboard.tsx || exit 1

      - name: Verify CoachActionDashboard exists
        run: |
          test -f apps/web/components/CoachActionDashboard.tsx || exit 1

      - name: Verify player dashboard API route exists
        run: |
          test -f apps/web/app/api/dashboard/player/route.ts || exit 1

      - name: Verify coach dashboard API route exists
        run: |
          test -f apps/web/app/api/dashboard/coach/route.ts || exit 1

      - name: Verify dashboard page uses new components
        run: |
          grep -q "PlayerActionDashboard" apps/web/app/\(app\)/dashboard/page.tsx || exit 1
          grep -q "CoachActionDashboard" apps/web/app/\(app\)/dashboard/page.tsx || exit 1

      - name: Verify Mobile-First: no table elements in player dashboard
        run: |
          if grep -q "<table" apps/web/components/PlayerActionDashboard.tsx; then
            echo "FAIL: table element found in PlayerActionDashboard (violates mobile-first rule)"
            exit 1
          fi

      - name: Verify Structured/Flexible mode toggle exists
        run: |
          grep -q "STRUCTURED\|FLEXIBLE" apps/web/components/PlayerActionDashboard.tsx || exit 1

      - name: Verify Bottom Nav present
        run: |
          test -f apps/web/components/BottomNav.tsx || exit 1

      - name: Verify LessonFocusArea color mapping
        run: |
          grep -q "FOCUS_AREA_COLOR\|focusArea" apps/web/components/PlayerActionDashboard.tsx || exit 1

      - name: Verify coach FAB exists
        run: |
          grep -q "MobileFAB\|FAB" apps/web/components/CoachActionDashboard.tsx || exit 1

      - name: Verify coach team cards are horizontal
        run: |
          grep -q "overflow-x-auto\|snap-x" apps/web/components/CoachActionDashboard.tsx || exit 1

  web-lint:
    name: Dashboard UI Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter db prisma generate

      - name: Lint Dashboard Components
        run: |
          cd apps/web
          pnpm exec eslint \
            components/PlayerActionDashboard.tsx \
            components/CoachActionDashboard.tsx \
            "app/(app)/dashboard/page.tsx" \
            app/api/dashboard/player/route.ts \
            app/api/dashboard/coach/route.ts \
            components/HeaderAndSidebarLayout.tsx \
            --max-warnings=0

  release-readiness:
    name: Epic 6 Release Readiness
    runs-on: ubuntu-latest

    needs:
      - architecture-guard
      - web-lint

    steps:
      - name: Release Ready
        run: |
          echo "Epic 6 Dashboard Action Hub validation successful"
          echo "Player dashboard: hero + heute + next highlight + dev plan"
          echo "Coach dashboard: hero + tagesagenda + FAB + attention + team cards"
          echo "Mobile-first rules enforced"
          echo "Bottom navigation verified"
