
services:
  api:
    image: ghcr.io/abue-99/golf-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: golf_api
    expose:
      - "4000"
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ACCESS_SECRET: ${ACCESS_SECRET:-your-access-secret-key-min-32-chars}
      REFRESH_SECRET: ${REFRESH_SECRET:-your-refresh-secret-key-min-32-chars}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://178.104.48.239}
      # Required for sending invitation emails via Resend (leave empty to skip email sending)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Public app URL embedded in invite email login links
      APP_URL: ${NEXT_PUBLIC_APP_URL:-http://178.104.48.239}
    restart: unless-stopped

  web:
    image: ghcr.io/abue-99/golf-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: golf_web
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      API_URL: http://golf_api:4000
      ACCESS_SECRET: ${ACCESS_SECRET:-your-access-secret-key-min-32-chars}
      AUTH_PROXY_DIAGNOSTICS: ${AUTH_PROXY_DIAGNOSTICS:-false}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://178.104.48.239/api}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      # Set to "true" only when the site is served over HTTPS
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # Required for sending password-reset emails via Resend (leave empty to skip email sending)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: golf_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-178.104.48.239}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: golf_network
