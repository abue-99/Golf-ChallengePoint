
services:
  postgres:
    image: postgres:16-alpine
    container_name: golf_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: challengepoint
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: golf_api
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/challengepoint"
      ACCESS_SECRET: ${ACCESS_SECRET:-your-access-secret-key-min-32-chars}
      REFRESH_SECRET: ${REFRESH_SECRET:-your-refresh-secret-key-min-32-chars}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://178.104.48.239}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: golf_web
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      API_URL: http://golf_api:4000
      ACCESS_SECRET: ${ACCESS_SECRET:-your-access-secret-key-min-32-chars}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://178.104.48.239}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/challengepoint
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: golf_caddy
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN:-178.104.48.239}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: golf_network
