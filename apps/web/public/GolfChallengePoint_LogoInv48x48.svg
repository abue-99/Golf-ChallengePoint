<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Green background -->
  <rect width="48" height="48" fill="#217a21" rx="4"/>

  <!-- Outer arc: large C-shape, open at top-right, ~270° arc -->
  <path d="M 36,6 A 20,20 0 1,0 36,42" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Middle arc -->
  <path d="M 33,10.5 A 14.5,14.5 0 1,0 33,37.5" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Inner arc -->
  <path d="M 30,15 A 9,9 0 1,0 30,33" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Golf ball -->
  <circle cx="21" cy="26" r="7.5" fill="white"/>
  <!-- dimples -->
  <ellipse cx="18.5" cy="23.5" rx="1" ry="1.3" fill="#217a21" transform="rotate(-20 18.5 23.5)"/>
  <ellipse cx="22.5" cy="22" rx="1" ry="1.3" fill="#217a21" transform="rotate(10 22.5 22)"/>
  <ellipse cx="19.5" cy="27.5" rx="1" ry="1.3" fill="#217a21" transform="rotate(-10 19.5 27.5)"/>
  <ellipse cx="23.5" cy="26" rx="1" ry="1.3" fill="#217a21" transform="rotate(15 23.5 26)"/>
  <ellipse cx="21" cy="21.5" rx="0.9" ry="1.2" fill="#217a21"/>
  <ellipse cx="17.5" cy="27" rx="0.9" ry="1.2" fill="#217a21" transform="rotate(-15 17.5 27)"/>

  <!-- Golf green / hill silhouette -->
  <path d="M 10,34 Q 16,28 21,33.5 Q 23,35.5 28,31 L 32,34 L 32,40 L 10,40 Z" fill="white"/>
  <!-- tee hole notch -->
  <ellipse cx="21" cy="33.8" rx="3" ry="1.5" fill="#217a21"/>

  <!-- Bar chart: left bar (shorter) -->
  <rect x="30" y="19" width="4.5" height="10" rx="1" fill="white"/>
  <!-- Bar chart: right bar (taller) -->
  <rect x="36" y="14" width="4.5" height="15" rx="1" fill="white"/>
</svg>
