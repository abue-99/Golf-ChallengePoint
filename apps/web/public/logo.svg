<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <!-- Green background -->
  <rect width="100" height="100" fill="#2d7a2d"/>

  <!-- Outer arc (C-shape, open right) -->
  <path d="M 78,15 A 38,38 0 1,0 78,85" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Middle arc -->
  <path d="M 72,22 A 29,29 0 1,0 72,78" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Inner arc -->
  <path d="M 66,30 A 20,20 0 1,0 66,70" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Golf ball (circle with dimples) -->
  <circle cx="46" cy="52" r="13" fill="white"/>
  <!-- dimples -->
  <circle cx="42" cy="48" r="1.5" fill="#2d7a2d"/>
  <circle cx="48" cy="46" r="1.5" fill="#2d7a2d"/>
  <circle cx="44" cy="54" r="1.5" fill="#2d7a2d"/>
  <circle cx="50" cy="52" r="1.5" fill="#2d7a2d"/>
  <circle cx="46" cy="43" r="1.2" fill="#2d7a2d"/>

  <!-- Tee / ground hill -->
  <ellipse cx="46" cy="65" rx="14" ry="5" fill="white"/>
  <ellipse cx="46" cy="64" rx="8" ry="3" fill="#2d7a2d"/>

  <!-- Bar chart (2 bars) -->
  <rect x="64" y="42" width="7" height="18" rx="1" fill="white"/>
  <rect x="74" y="36" width="7" height="24" rx="1" fill="white"/>
</svg>
